name: Database request
description: A database Kagi doesn't support yet.
labels: [database]
body:
  - type: input
    id: database
    attributes:
      label: Database
      placeholder: "Oracle, Cassandra, Elasticsearch, …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version you use
      placeholder: "23ai, 24.1, …"
  - type: textarea
    id: use
    attributes:
      label: What you'd use Kagi for with it
      description: Browsing tables, writing queries, editing data, …
    validations:
      required: true

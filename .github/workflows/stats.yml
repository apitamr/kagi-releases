# The README's counts, as shields.io endpoint badges written when they
# change:
# - stats/downloads.json, people's downloads of the releases' files. Until
#   0.5.7 (stats/ci-until, its publishing time) the builds downloaded their
#   own packages (.deb, Arch, Flatpak, snap) to make the repositories, so
#   those releases' packages aren't counted.
# - stats/snap-installs.json, the machines the Snap Store says have Kagi
#   installed, from its metrics (the store login needs package_metrics).
# The APT, pacman and Flatpak repositories on Pages can't be counted.
name: stats

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: People's downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          until=$(cat stats/ci-until)
          real=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq \
            ".[] | (.published_at <= \"$until\") as \$built
              | .assets[] | select((\$built and (.name | test(\"[.](deb|flatpak|snap)\$|[.]pkg[.]tar[.]zst\$\"))) | not)
              | .download_count" | awk '{t += $1} END {print t + 0}')
          printf '{"schemaVersion":1,"label":"downloads","message":"%s","color":"1c1713"}\n' \
            "$real" > stats/downloads.json
      - name: Snap installs
        # A missing login or metric only warns: the downloads still go out.
        continue-on-error: true
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::warning::No SNAPCRAFT_STORE_CREDENTIALS secret: no snap installs"
            exit 0
          fi
          sudo snap install snapcraft --classic
          # The latest day the Store has counted, summed over the channels.
          snapcraft metrics kagi --name installed_base_by_channel --format json \
            --start "$(date -u -d '-7 days' +%Y-%m-%d)" --end "$(date -u +%Y-%m-%d)" > metrics.json
          cat metrics.json
          installs=$(jq '[.series[].values | map(select(. != null)) | last // 0] | add // 0' metrics.json)
          printf '{"schemaVersion":1,"label":"installs (snap)","message":"%s","color":"1c1713"}\n' \
            "$installs" > stats/snap-installs.json
      - name: Commit
        run: |
          git add stats
          git diff --cached --quiet && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "stats: $(jq -r .message stats/downloads.json) downloads"
          git pull --rebase
          git push

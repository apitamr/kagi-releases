# Builds Kagi's packages from its private source and publishes them here.
# This repository is public, so its Actions minutes are free, the macOS
# (10x) and Windows (2x) builds above all.
#
# Started only by the owner: `make release` in the source (it tags the
# version and asks for a published run), or a manual run here (publish off
# to try the packages without a release). Never by a pull request, so forks
# never run it with the secrets.
#
# SOURCE_TOKEN: a fine-grained token with Contents: read on apitamr/kagi
# and apitamr/slop-ui (the ui crate, checked out next to it by path).
# AUR_SSH_KEY: the private SSH key of the AUR account that keeps kagi-bin;
# without it a release is not pushed to the AUR.
# SNAPCRAFT_STORE_CREDENTIALS: `snapcraft export-login` of the Snap Store
# account that owns the kagi snap; without it the snap is attached to the
# release but not uploaded to the Store.
# REPO_GPG_KEY: the private key that signs the package repositories on this
# repository's GitHub Pages (scripts/linux/repo_key.sh in the source makes
# it); without it they are not published.
#
# The logs are public: nothing here prints the source, and the packages
# uploaded between jobs are the ones published anyway.
name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag of apitamr/kagi to build (e.g. v0.1.0)
        required: true
      publish:
        description: Publish a release from it
        type: boolean
        default: false

concurrency:
  group: build-${{ inputs.tag }}

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Linux's tarball, .deb, AppImage and Flatpak (and the Arch package from
  # the tarball), Windows' MSI and the macOS .dmg. The Linux and Windows ones
  # are installed and started, and must still be running 10 seconds later.
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux on both processors: ARM64 for ARM laptops and servers.
        # Ubuntu 24.04 on both, pinned: the snap builds on the release its
        # base is (core24), and ubuntu-latest moves on.
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: db-inu
    steps:
      - name: A version tag
        working-directory: .
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "not a version tag: '$TAG'" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          repository: apitamr/kagi
          ref: ${{ env.TAG }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: db-inu
      - uses: actions/checkout@v4
        with:
          repository: apitamr/slop-ui
          token: ${{ secrets.SOURCE_TOKEN }}
          path: ui-rs
      - name: Latest stable Rust
        run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: db-inu -> target
          key: package
      - name: The tag names the version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ "${TAG#v}" = "$version" ] || { echo "tag $TAG, Cargo.toml $version" >&2; exit 1; }
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo scripts/linux/deps.sh
          scripts/linux/package.sh
      # A software Vulkan (lavapipe) under a virtual X server.
      - name: Install and start (.deb, AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers
          sudo apt-get install -y ./target/linux-$(uname -m)/kagi_*_$(dpkg --print-architecture).deb
          for app in kagi target/linux-$(uname -m)/kagi-*-$(uname -m).AppImage; do
            status=0
            APPIMAGE_EXTRACT_AND_RUN=1 timeout 10 xvfb-run -a "$app" || status=$?
            [ "$status" = 124 ] || { echo "$app exited with $status" >&2; exit 1; }
          done
      # x86-64 only, as Arch Linux (and Omarchy) is.
      - name: Arch package
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          mkdir arch && cp target/linux-x86_64/PKGBUILD target/linux-x86_64/kagi-*-x86_64.tar.gz arch/
          docker run --rm -v "$PWD/arch:/pkg" archlinux:latest sh -c '
            pacman -Syu --noconfirm --needed base-devel >/dev/null
            useradd -m builder && cp -r /pkg /home/builder/pkg && chown -R builder /home/builder/pkg
            su builder -c "cd ~/pkg && makepkg --nodeps --noconfirm" >/dev/null
            pacman -U --noconfirm /home/builder/pkg/kagi-bin-*.pkg.tar.zst
            test -x /usr/bin/kagi && test -f /usr/share/applications/dev.kagi.desktop
            cp /home/builder/pkg/kagi-bin-*.pkg.tar.zst /pkg/'
          # Published with the release: the pacman repository serves it, and
          # Kagi's Update installs it.
          sudo cp arch/kagi-bin-*.pkg.tar.zst target/linux-x86_64/
      - name: Flatpak
        if: runner.os == 'Linux'
        env:
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
        run: |
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          # Signed with the repositories' key, the bundle updates from Kagi's
          # Flatpak repository (scripts/linux/flatpak.sh); without it, plain.
          if [ -n "$REPO_GPG_KEY" ]; then
            printf '%s\n' "$REPO_GPG_KEY" | gpg --batch --import
            export REPO_GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          fi
          # The Rust cache brings target/ back with the last run's Flatpak
          # folders cut down; flatpak-builder can't use what is left.
          rm -rf target/linux-$(uname -m)/flatpak-*
          scripts/linux/flatpak.sh
          flatpak install --user -y --noninteractive target/linux-$(uname -m)/kagi-*-$(uname -m).flatpak
          flatpak info --user io.github.apitamr.kagi_releases.Kagi
      # The snap (Ubuntu's App Center, through the Snap Store), built on
      # this Ubuntu 24.04 as its base is, then installed.
      - name: Snap
        if: runner.os == 'Linux'
        run: |
          sudo snap install snapcraft --classic
          # As root: it installs its build snaps on this machine.
          sudo scripts/linux/snap.sh
          sudo chown -R "$(id -u):$(id -g)" target/linux-$(uname -m)
          sudo snap install --dangerous target/linux-$(uname -m)/kagi_*_$(dpkg --print-architecture).snap
          snap list kagi
      # What Flathub's review runs on the manifest, the listing and the
      # build; a finding is shown here but doesn't hold the release back.
      - name: Flathub lint
        if: runner.os == 'Linux' && runner.arch == 'X64'
        continue-on-error: true
        run: |
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
          lint="flatpak run --command=flatpak-builder-lint org.flatpak.Builder"
          # All three, each reporting, then failing if any found something.
          found=0
          $lint manifest target/linux-x86_64/flathub/io.github.apitamr.kagi_releases.Kagi.yml || found=1
          $lint appstream target/linux-x86_64/flathub/io.github.apitamr.kagi_releases.Kagi.metainfo.xml || found=1
          $lint repo target/linux-x86_64/flatpak-repo || found=1
          exit $found
      - name: MSI
        if: runner.os == 'Windows'
        run: |
          choco install make --no-progress
          dotnet tool install --global wix --version 5.0.2
          PATH="$PATH:$HOME/.dotnet/tools" make msi
      - name: Install and start (MSI)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/windows/*.msi | Select-Object -First 1
          $install = Start-Process msiexec -ArgumentList "/i", $msi.FullName, "/qn" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "msiexec exited with $($install.ExitCode)" }
          $app = Start-Process "$env:ProgramFiles\kagi\kagi.exe" -PassThru
          Start-Sleep 10
          if ($app.HasExited) { throw "kagi exited with $($app.ExitCode)" }
          Stop-Process $app
      # Signed ad hoc until there is a Developer ID (`make notarize`).
      - name: macOS app
        if: runner.os == 'macOS'
        run: make bundle dmg
      # The PKGBUILD names the x86-64 tarball: the ARM job's would clash
      # with it in the release.
      - name: No ARM PKGBUILD
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: rm -f target/linux-*/PKGBUILD
      - uses: actions/upload-artifact@v4
        with:
          name: kagi-${{ runner.os }}-${{ runner.arch }}
          retention-days: 3
          path: |
            db-inu/target/linux-*/*.tar.gz
            db-inu/target/linux-*/PKGBUILD
            db-inu/target/linux-*/*.deb
            db-inu/target/linux-*/*.pkg.tar.zst
            db-inu/target/linux-*/*.AppImage
            db-inu/target/linux-*/*.flatpak
            db-inu/target/linux-*/*.snap
            db-inu/target/windows/*.msi
            db-inu/target/release/bundle/*.dmg
          if-no-files-found: error

  # Publishes the packages as this repository's release of the tag, its
  # notes the version's section of the source's CHANGELOG.md (else the
  # commits since the version tag before it).
  release:
    name: release
    needs: package
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          repository: apitamr/kagi
          ref: ${{ env.TAG }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: source
          fetch-depth: 0
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The version's own section of the changelog, from its "## <version>"
          # to the next "## ", blank lines around it dropped.
          awk -v heading="## ${TAG#v}" '$0 == heading {found=1; next} found && /^## / {exit} found' \
            source/CHANGELOG.md | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          # Without one: the commits since the version before; the first
          # release says so.
          if ! grep -q . notes.md; then
            previous=$(git -C source describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
            if [ -n "$previous" ]; then
              git -C source log --format='- %s' "$previous..$TAG" > notes.md
            else
              echo "The first release of Kagi." > notes.md
            fi
          fi
          # The artifacts keep their folders (the .dmg in release/bundle/):
          # every file under dist, wherever it lies.
          find dist -type f -print0 | xargs -0 gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" --title "Kagi ${TAG#v}" --notes-file notes.md
      - uses: actions/checkout@v4
        with:
          path: site
      # The README's download buttons link straight to this release's files,
      # whose names carry the version, so latest/download/<name> can't.
      - name: README links
        # The release is out by now: a failed push only warns.
        continue-on-error: true
        working-directory: site
        run: |
          version=${TAG#v}
          sed -E -i \
            -e "s#(releases/download/)v[0-9]+(\.[0-9]+)*/#\1$TAG/#g" \
            -e "s#(releases/download/$TAG/kagi[-_])[0-9]+(\.[0-9]+)*([-_.])#\1$version\3#g" \
            README.md
          git diff --quiet && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -am "docs: download links for $version"
          git pull --rebase
          git push
      # The release's PKGBUILD (its checksum filled in) as kagi-bin on the
      # AUR, with the .SRCINFO the AUR reads. The host key is pinned
      # (SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4, as the AUR
      # publishes it).
      - name: AUR
        # The release is out by now: an AUR hiccup only warns.
        continue-on-error: true
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::warning::No AUR_SSH_KEY secret: kagi-bin not updated on the AUR"
            exit 0
          fi
          pkgbuild=$(find dist -name PKGBUILD | head -n 1)
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/kagi-bin.git aur
          cp "$pkgbuild" aur/PKGBUILD
          docker run --rm -v "$PWD/aur:/pkg" archlinux:latest sh -c '
            useradd -m builder && chown -R builder /pkg
            su builder -c "cd /pkg && makepkg --printsrcinfo > .SRCINFO"'
          sudo chown -R "$(id -u):$(id -g)" aur
          cd aur
          git config user.name apitamr
          git config user.email apitamr@users.noreply.github.com
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${TAG#v}"
          git push origin HEAD:master

  # The release's snap on the Snap Store's stable channel, so Ubuntu's App
  # Center lists and updates it.
  snap:
    name: snap
    needs: release
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Upload
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::warning::No SNAPCRAFT_STORE_CREDENTIALS secret: the snap isn't on the Snap Store"
            exit 0
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p 'kagi_*.snap'
          sudo snap install snapcraft --classic
          for snap in kagi_*.snap; do
            snapcraft upload --release=stable "$snap"
          done

  # The package repositories on this repository's GitHub Pages
  # (https://apitamr.github.io/kagi-releases): APT, pacman and Flatpak,
  # made again from the last releases' files and signed (the source's
  # scripts/linux/repos.sh), so the .deb, the Arch package and the Flatpak
  # update with the system and from Kagi's Update button.
  pages:
    name: pages
    needs: release
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: A signing key
        id: key
        env:
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
        run: |
          if [ -z "$REPO_GPG_KEY" ]; then
            echo "::warning::No REPO_GPG_KEY secret: the package repositories aren't published"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$REPO_GPG_KEY" | gpg --batch --import
          fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          echo "REPO_GPG_KEY_ID=$fingerprint" >> "$GITHUB_ENV"
          echo "present=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          repository: apitamr/kagi
          ref: ${{ env.TAG }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: source
      # The last three releases' packages: a system a version or two behind
      # still finds its own, and the site stays small.
      - name: The packages
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir files
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 3 --json tagName -q '.[].tagName'); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir files \
              -p 'kagi_*_*.deb' -p 'kagi-bin-*.pkg.tar.zst' -p 'kagi-*.flatpak' || true
          done
          ls -l files
      - name: The repositories
        if: steps.key.outputs.present == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apt-utils flatpak ostree
          source/scripts/linux/repos.sh files site
      - uses: actions/configure-pages@v5
        if: steps.key.outputs.present == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.key.outputs.present == 'true'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.key.outputs.present == 'true'
        id: deploy

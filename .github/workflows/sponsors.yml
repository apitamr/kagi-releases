# The README's sponsors: each public sponsor's avatar, linked to them,
# between the <!-- sponsors --> markers, written when it changes. The job's
# own token can't see sponsorships, so it reads them with SPONSORS_TOKEN,
# a token of the maintainer's with read:user (an organization by its name,
# as its login would need read:org).
name: sponsors

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sponsors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sponsors
        env:
          GH_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No SPONSORS_TOKEN secret: the README's sponsors aren't updated"
            exit 0
          fi
          gh api graphql -f query='{ user(login: "apitamr") { sponsorshipsAsMaintainer(first: 100, activeOnly: true) { nodes { privacyLevel sponsorEntity { ... on User { login url avatarUrl } ... on Organization { name url avatarUrl } } } } } }' \
            --jq '[.data.user.sponsorshipsAsMaintainer.nodes[] | select(.privacyLevel == "PUBLIC") | .sponsorEntity]' > sponsors.json
          python3 - <<'PY'
          import json, re
          sponsors = json.load(open("sponsors.json"))
          if sponsors:
              body = " ".join(
                  f'<a href="{s["url"]}"><img src="{s["avatarUrl"]}&s=96" width="48" height="48" alt="{s.get("login") or s.get("name")}" title="{s.get("login") or s.get("name")}"></a>'
                  for s in sponsors
              )
          else:
              body = "No sponsors yet. [Be the first](https://github.com/sponsors/apitamr)."
          readme = open("README.md").read()
          readme = re.sub(r"(<!-- sponsors -->\n).*?(\n<!-- /sponsors -->)",
                          lambda m: m.group(1) + body + m.group(2), readme, flags=re.S)
          open("README.md", "w").write(readme)
          PY
          git diff --quiet README.md && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -am "docs: sponsors"
          git pull --rebase
          git push
